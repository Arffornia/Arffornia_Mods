name: Bug report
description: Something does not work as expected
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines. Remove any secrets or tokens.
      render: text
