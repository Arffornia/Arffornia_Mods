name: GameTest

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gametest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # Headless GameTest server against the in-memory progression backend.
      # Exits non-zero when a required test fails.
      - name: runGameTestServer
        run: ./gradlew runGameTestServer --no-daemon -Dorg.gradle.jvmargs=-Xmx2g
